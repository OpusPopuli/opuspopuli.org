name: CI

# The repo is trunk-based: feature branches PR into main. This is the pre-merge
# gate. deploy.yml re-runs the same checks on main before shipping, so a direct
# push cannot bypass them either.
on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Covers WCAG 2.2 AA across every page (CLAUDE.md requires AA) and the
      # numeric integrity of the published §9118 thresholds.
      - name: Run tests
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
